name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Restore Android folder
        run: |
          if [ ! -d "android/app" ]; then
            flutter create --org com.kamranraees --project-name hackguide --platforms=android .
          fi
          ls android/app/

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: hackguide-apk
          path: build/app/outputs/flutter-apk/app-release.apk
