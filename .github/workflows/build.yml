name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: flutter create --project-name hackguide_pro --platforms=android.

      - name: Use my main.dart and add packages
        run: |
          cp main.dart lib/main.dart
          flutter pub add http shared_preferences

      - name: Internet permission
        run: |
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET" />\n <application|' android/app/src/main/AndroidManifest.xml

      - name: Add new App Icon
        run: |
          for d in android/app/src/main/res/mipmap-*; do cp assets/icon.png $d/ic_launcher.png; done
          for d in android/app/src/main/res/mipmap-*; do cp assets/icon.png $d/launcher_icon.png || true; done

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: hackguide-apk
          path: build/app/outputs/flutter-apk/app-release.apk
