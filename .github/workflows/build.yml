name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: |
          flutter pub add firebase_core firebase_auth google_sign_in google_mobile_ads pdf printing http shared_preferences
      - name: Internet permission
        run: |
          grep -q "INTERNET" android/app/src/main/AndroidManifest.xml || sed -i '2i\ <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml
      - name: Add custom app icon
        run: |
          if [ -f "assets/icon.png" ]; then
            for d in android/app/src/main/res/mipmap-*; do
              cp assets/icon.png "$d/ic_launcher.png"
            done
            echo "Icon added"
          else
            echo "assets/icon.png not found, using default icon"
          fi
      - name: Build release APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: hackguide-apk
          path: build/app/outputs/flutter-apk/app-release.apk
